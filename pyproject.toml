[project]
name = "defectlab"
version = "0.1.0"
description = "Multi-modal casting defect prediction with a physics-based process twin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1,<2.5",
    "pandas>=2.2,<3",
    "scipy>=1.18,<2",
    "pyarrow>=25.0",
    "pandera>=0.32",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
]

[project.scripts]
defectlab = "defectlab.cli.main:main"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.9,<2",
    "xgboost>=3.3,<4",
    "interpret>=0.7",
    "shap>=0.52",
    "numba>=0.61",
    "mapie>=1.4",
    "torch>=2.13",
    "torchvision>=0.28",
    "timm>=1.0",
    "opencv-python-headless>=5.0",
    "mlflow>=3.15",
]
api = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "psycopg[binary]>=3.3",
    "sqlalchemy>=2.0",
    "redis>=5.2",
    "paho-mqtt>=2.1",
]
viz = ["matplotlib>=3.11", "seaborn>=0.13"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "hypothesis>=6.164",
    "ruff>=0.16",
    "import-linter>=2.3",
]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# CPU-only wheels: ~200 MB instead of ~2.5 GB of unused CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defectlab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The build guide is the original specification; its snippets are a record, not our code.
extend-exclude = ["multimodal_defect_prediction_build_guide.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415", "E501"]
# Heavy optional dependencies are imported lazily inside their factory functions.
"src/defectlab/imaging/backbones.py" = ["PLC0415"]
"src/defectlab/imaging/features.py" = ["PLC0415"]
# Keeps the sklearn and xgboost import cost off the fast commands.
"src/defectlab/cli/commands.py" = ["PLC0415"]
"src/defectlab/models/estimators.py" = ["PLC0415"]
"src/defectlab/explain/attribution.py" = ["PLC0415"]
"src/defectlab/prescribe/surrogate.py" = ["PLC0415"]
"src/defectlab/prescribe/search.py" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.importlinter]
root_package = "defectlab"

[[tool.importlinter.contracts]]
name = "Twin is ground truth and must not depend on models"
type = "forbidden"
source_modules = ["defectlab.twin"]
forbidden_modules = ["defectlab.data", "defectlab.imaging"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "(defectlab.cli)",
    "(defectlab.report)",
    "(defectlab.api)",
    "(defectlab.prescribe)",
    "(defectlab.explain)",
    "(defectlab.models)",
    "(defectlab.spc)",
    "(defectlab.economics)",
    "(defectlab.imaging)",
    "defectlab.data",
    "defectlab.twin",
    "defectlab.config",
]
