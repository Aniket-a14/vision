# Serves the built app and proxies the API under the same origin, which is why the production
# bundle needs no CORS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE dies behind a buffering proxy: nginx would hold the events until the buffer filled
        # and the live line would arrive in bursts, or not at all.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }
}
