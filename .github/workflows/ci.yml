name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_FROZEN: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv python install 3.13

      - name: Install
        run: uv sync --extra ml --extra viz

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest tests -q --cov=defectlab --cov-report=term-missing
